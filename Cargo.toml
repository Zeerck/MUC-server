[package]
name = "MUC-server"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
colored = "3.1.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono", "uuid"] }
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
dirs = "6.0.0"