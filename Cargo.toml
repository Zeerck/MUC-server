[package]
name = "MUC-server"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.24.0", features = ["v4"] }
anyhow = "1.0.104"
rusqlite = { version = "0.40.1", features = ["bundled", "uuid"] }
colored = "3.1.1"
dotenvy = "0.15.7"
argon2 = { version = "0.5.3", features = ["std"] }
password-hash = "0.6.1"
rand_core = "0.10.1"
dirs = "6.0.0"
ctrlc = "3.5.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["alloc"] }
zxcvbn = "3.1.1"